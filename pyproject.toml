[project]
name = "python-socketio-stubs"
version = "0.0.0"
description = "python-socketio stubs"
authors = [{ name = "phi", email = "phi.friday@gmail.com" }]
dependencies = ["python-socketio==5.17.0", "typing-extensions>=4.4.0"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Stubs Only",
]

[project.urls]
Repository = "https://github.com/phi-friday/python-socketio-stubs"

[project.optional-dependencies]
mypy = ["mypy>=2.4.0"]
mypy-strict = ["mypy==2.4.0", "python-socketio-stubs[mypy]"]

[dependency-groups]
python-socketio-dependencies = [
    "python-socketio[client,asyncio_client]>=5.17.0",
    "msgpack-types>=0.8.0",
    "eventlet>=0.41.2",
    "tornado>=6.5.10",
    "kombu>=5.6.2",
    "kafka-python>=3.0.11",
    "gevent>=26.9.0",
    "sanic>=25.12.1",
    "aio-pika>=10.1.0",
    "redis>=8.1.0",
    "valkey>=6.1.1",
]
test = [{ include-group = "python-socketio-dependencies" }, "pytest>=9.1.1"]
dev = [
    { include-group = "python-socketio-dependencies" },
    "ruff==0.17.0",
    "poethepoet>=0.48.0",
    "python-socketio-stubs[mypy-strict]",
    "pyrefly==1.3.2",
]

[tool.uv]
managed = true
default-groups = ["dev", "test"]
exclude-newer = "3 days"

[tool.uv.exclude-newer-package]
python-socketio = false
pyrefly = false
ruff = false

[tool.poe.tasks]
lint = ["_lint:check", "_lint:format"]
"_lint:check" = "ruff check src --fix"
"_lint:format" = "ruff format src"
mypy = "mypy src --strict"
pyrefly = "pyrefly check --config pyrefly.toml src .agents"
pyre.ref = "pyrefly"
check = ["lint", "mypy", "pyrefly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socketio-stubs"]

[tool.hatch.build.targets.sdist]
include = ["src/socketio-stubs"]

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = "import-untyped,overload-overlap,override"
disallow_subclassing_any = false
local_partial_types = true
ignore_missing_imports = true
mypy_path = "typings"
